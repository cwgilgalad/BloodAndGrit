# What runs on someone else's machine, automatically.
#
# WHAT LEFT, AND WHY (2026-08-10)
#
# This workflow used to carry a second job called `books` that ran eight different
# checks in one go, on every push, including pushes of session branches. Two things
# were wrong with that and neither was the checks.
#
# The first: the pushes. A scheduled task committed and pushed the checked-out branch
# every 30 minutes, so CI ran against work that was half-written by definition, and the
# red X that came back was reporting on a state nobody had claimed was finished. That
# task is gone; a branch now reaches GitHub when it is merged, and not before.
#
# The second: the bundling. Eight checks under one job name meant any one of them
# failing read as "the books are broken" -- and the job was called `books` while it
# also audited the C# UI, the release tags and the repo's own prose. They are separate
# files in audits/ now, each with its own name, run when somebody decides to run them:
#
#     python audits/audit_names.py
#     python audits/verify_rules.py
#     ...see audits/README.md for the full set and what each costs.
#
# The app job stays automatic. It compiles and executes ~12,000 assertions, which is
# exactly the kind of thing a machine should do unasked and a person should not have to
# remember.
#
# Deliberately never here: audits/audit_whitespace.py and the measure_* tools. They
# drive a real browser through Playwright to measure rendered page geometry, and
# pagination is environment-dependent by design -- a cloud runner measures a different
# page count than the machine the books are proofed on and fails for no useful reason.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  app:
    # windows-latest, not ubuntu: the app is net8.0-windows WinForms, and the self-test
    # constructs the real window graph. The rules library and the smoke rig are plain
    # net8.0 and would build anywhere, but there is no value in splitting the job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the app (0 warnings, 0 errors is the standard)
        run: dotnet build -c Release -warnaserror
        working-directory: GK/source

      - name: Logic suite — ~12,000 assertions over the rules, chargen, maps and PDF writer
        run: dotnet run -c Release
        working-directory: GK/smoke

      - name: Self-test — builds the real window graph in all three run modes
        # Constructs every tab and every wizard step, and fails on any interactive control
        # with no tooltip. Written to report-but-not-fail if WinForms cannot realize on a
        # headless station, so this stays honest on a runner without a desktop rather than
        # going red for the wrong reason. Its exit code still fails the job on a genuine
        # assertion failure.
        run: ./GritKeeper.exe --selftest
        working-directory: GK/source/bin/Release/net8.0-windows/win-x64

      - name: Publish the self-contained single file, and self-test THAT
        # The one failure mode a dev build cannot show: Db.ReadData resolves embedded
        # resources off typeof(Db).Assembly, so a data file embedded in the wrong project
        # works in a dev run and finds nothing inside the bundle. Only a published exe
        # proves it.
        run: |
          dotnet publish -c Release
          ./bin/Release/net8.0-windows/win-x64/publish/GritKeeper.exe --selftest
        working-directory: GK/source
